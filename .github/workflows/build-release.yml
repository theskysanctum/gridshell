name: Build and release installer

on:
  push:
    branches: [master, stable]
    paths:
      - src/**
      - installer/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'master' || github.ref_name == 'stable'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bump patch version
        shell: bash
        run: |
          current=$(grep -oP '(?<=#define MyAppVersion ")[^"]+' installer/GridShell.iss)
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)
          next="$major.$minor.$((patch + 1))"

          sed -i "s/#define MyAppVersion \"$current\"/#define MyAppVersion \"$next\"/" installer/GridShell.iss

          # Keeps each exe project's <Version> (read at runtime by UpdateChecker via
          # Assembly.GetName().Version) in lockstep with the installer version.
          for csproj in src/GridShell/GridShell.csproj src/GridShell.Grid/GridShell.Grid.csproj src/GridShell.Watchdog/GridShell.Watchdog.csproj; do
            sed -i "s#<Version>$current</Version>#<Version>$next</Version>#" "$csproj"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add installer/GridShell.iss src/GridShell/GridShell.csproj src/GridShell.Grid/GridShell.Grid.csproj src/GridShell.Watchdog/GridShell.Watchdog.csproj
          git commit -m "chore: bump version to $next [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

      - name: Publish self-contained win-x64 builds
        run: |
          dotnet publish src/GridShell/GridShell.csproj -c Release -o publish/GridShell
          dotnet publish src/GridShell.Grid/GridShell.Grid.csproj -c Release -o publish/GridShell.Grid
          dotnet publish src/GridShell.Watchdog/GridShell.Watchdog.csproj -c Release -o publish/GridShell.Watchdog

      - name: Fetch installer redistributables
        shell: pwsh
        run: installer/fetch-redist.ps1

      - name: Determine version
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=#define MyAppVersion ")[^"]+' installer/GridShell.iss)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\GridShell.iss

      - name: Publish release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "stable" ]]; then
            channel="stable"
            tag="v$VERSION"
            title="GridShell $VERSION"
          else
            channel="nightly"
            tag="nightly-$VERSION"
            title="GridShell $VERSION Nightly"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi

          installer_path="installer/Output/GridShell-Setup-$VERSION.exe"
          sum=$(sha256sum "$installer_path" | cut -d' ' -f1)

          # Keep a version-less asset name so the website can resolve the current build in each channel.
          current_path="installer/Output/GridShell-Setup.exe"
          cp "$installer_path" "$current_path"

          release_args=(
            --target "$(git rev-parse HEAD)"
            --title "$title"
            --notes "GridShell $VERSION ($channel).

          SHA-256 of GridShell-Setup-$VERSION.exe: $sum"
          )

          if [[ "$channel" == "stable" ]]; then
            release_args+=(--latest)
          else
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$tag" "$installer_path" "$current_path" "${release_args[@]}"
